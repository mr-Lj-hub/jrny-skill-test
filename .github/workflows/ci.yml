name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint, Audit, and Test
  # ──────────────────────────────────────────────
  build-and-audit:
    name: Build & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high
        # Fails the pipeline if any high or critical vulnerability is found
        # in the dependency tree. This catches supply-chain attacks early.

      - name: Run tests
        run: npm test

  # ──────────────────────────────────────────────
  # Job 2: Docker Image Build Verification
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: build-and-audit

    env:
      # ── Replace with your actual container registry ──
      # Examples:
      #   Docker Hub:  docker.io/<your-org>/taskflow
      #   GitHub GHCR: ghcr.io/${{ github.repository }}
      #   AWS ECR:     <account-id>.dkr.ecr.<region>.amazonaws.com/taskflow
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE_NAME: taskflow

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verify Dockerfile compiles)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Uncomment below to push to a registry on main branch merges ──
      # - name: Log in to Container Registry
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ env.REGISTRY }}
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
